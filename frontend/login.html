<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-6">
                <h2>Welcome Back</h2>
                <p class="text-muted mt-1" style="color: var(--text-muted); font-size: 0.875rem;">Login to manage the library</p>
            </div>

            <div id="login-alert" class="alert alert-danger"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary w-full mt-4">Sign In</button>
            </form>

            <div class="text-center mt-6" style="font-size: 0.875rem;">
                <span style="color: var(--text-muted);">Don't have an account?</span> 
                <a href="register.html">Register</a>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
