<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-6">
                <h2>Create Account</h2>
                <p class="text-muted mt-1" style="color: var(--text-muted); font-size: 0.875rem;">Join the library system</p>
            </div>

            <div id="register-alert" class="alert"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name" class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="reg-email" class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password" class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" id="register-btn" class="btn btn-primary w-full mt-4">Register</button>
            </form>

            <div class="text-center mt-6" style="font-size: 0.875rem;">
                <span style="color: var(--text-muted);">Already have an account?</span> 
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
